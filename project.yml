name: Done
options:
  bundleIdPrefix: com.martinss27
  deploymentTarget:
    iOS: "17.0"
targets:
  Done:
    type: application
    platform: iOS
    sources: [Done, Shared]
    dependencies:
      - target: DoneReport
    info:
      path: Done/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Done/Done.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DoneReport:
    type: app-extension
    platform: iOS
    sources: [Report, Shared]
    info:
      path: Report/Info.plist
      properties:
        CFBundleDisplayName: Done Report
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done.report
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Report/Report.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
