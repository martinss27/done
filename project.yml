name: Done
options:
  bundleIdPrefix: com.martinss27
  deploymentTarget:
    iOS: "17.0"
targets:
  Done:
    type: application
    platform: iOS
    sources: [Done, Shared]
    scheme:
      testTargets:
        - DoneTests
    dependencies:
      - target: DoneReport
      - target: DoneWidget
      - target: DoneMonitor
      - target: DoneShield
      - target: DoneShieldAction
    info:
      path: Done/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Done
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Rings when a focus round or a break ends.
        NSHealthShareUsageDescription: Reads your steps and workouts so moving can unlock the apps you blocked.
        NSLocationWhenInUseUsageDescription: Shows the map so you can pick the place a block applies to.
        NSLocationAlwaysAndWhenInUseUsageDescription: Locks and unlocks your apps when you arrive at or leave a place, with Done closed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Done/Done.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DoneWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Focus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done.widget
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Done
    settings:
      base:
        DEVELOPMENT_TEAM: R37QVQP98Y
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  DoneMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: Done Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done.monitor
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Monitor/Monitor.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DoneShield:
    type: app-extension
    platform: iOS
    sources: [ShieldUI, Shared]
    info:
      path: ShieldUI/Info.plist
      properties:
        CFBundleDisplayName: Done Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done.shield
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShieldUI/ShieldUI.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DoneShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Done Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done.shieldaction
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DoneReport:
    type: app-extension
    platform: iOS
    sources: [Report, Shared]
    info:
      path: Report/Info.plist
      properties:
        CFBundleDisplayName: Done Report
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinss27.done.report
        DEVELOPMENT_TEAM: R37QVQP98Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Report/Report.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
